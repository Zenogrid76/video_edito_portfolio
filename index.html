<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ================= BASIC META ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ================= TITLE ================= -->
    <!-- CHANGE: Your name / primary keyword -->
    <title>Mahmud Reza Mahim | Video Editor & Motion Graphics Designer</title>

    <!-- ================= SEO META ================= -->
    <!-- CHANGE: Improve description when branding evolves -->
    <meta
      name="description"
      content="Mahmud Reza Mahim is a professional video editor and motion graphics designer with 7+ years of experience, 350+ projects completed, and 10M+ views generated. Available for YouTube, commercials, and social media videos."
    />

    <!-- OPTIONAL: Keywords (not critical, but fine) -->
    <meta
      name="keywords"
      content="video editor, motion graphics designer, video editing, after effects, premiere pro, youtube editor, commercial video editor, social media videos"
    />

    <meta name="author" content="Mahmud Reza Mahim" />
    <meta name="robots" content="index, follow" />

    <!-- ================= OPEN GRAPH ================= -->
    <!-- CHANGE: Your live domain -->
    <meta property="og:url" content="https://YOUR-DOMAIN.com" />

    <meta
      property="og:title"
      content="Mahmud Reza Mahim | Video Editor & Motion Graphics Designer"
    />
    <meta
      property="og:description"
      content="Professional video editor with 7+ years experience, 350+ projects, and 10M+ views."
    />
    <meta property="og:type" content="website" />

    <!-- CHANGE: Social preview image -->
    <!-- File location: public/og-image.png (1200x630) -->
    <meta property="og:image" content="/Logo_redesign.png" />

    <!-- ================= TWITTER ================= -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- CHANGE: Your Twitter / X handle -->
    <meta name="twitter:creator" content="@YOUR_HANDLE" />

    <meta
      name="twitter:title"
      content="Mahmud Reza Mahim | Video Editor & Motion Graphics Designer"
    />
    <meta
      name="twitter:description"
      content="Video editor & motion graphics designer with 7+ years experience."
    />

    <!-- CHANGE: Same image as OG -->
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ================= FONTS ================= -->
    <!-- ADD Google Font link below if you use one -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ================= FAVICON ================= -->
    <!-- CHANGE: Your logo (square PNG, 512x512 recommended) -->
    <!-- File location: public/favicon.png -->
    <link rel="icon" type="image/png" href="src/assets/Logo_redesign.png" />
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this website. </noscript>

    <div id="root"></div>

    <!-- ================= VITE ENTRY ================= -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
